name: Build APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install && npm run build
      - run: |
          rm -rf app/src/main/assets/web/*
          cp -r dist/* app/src/main/assets/web/
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.3.1 }
      - run: keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fitna-debug-apk
          path: app/build/outputs/apk/debug/*.apk
