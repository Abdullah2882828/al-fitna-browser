<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>الفطنة — متصفح مصغّر لنقل المشاريع إلى GitHub</title>
    <meta name="description" content="ينقل مشاريع الكود من محادثات الذكاء الاصطناعي إلى ملفات حقيقية ويرفعها إلى GitHub" />
    <meta name="theme-color" content="#151515" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Fonts: Tajawal and Cairo with local fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-light-bg dark:bg-dark-bg text-light-text dark:text-dark-text overflow-hidden select-none font-arabic antialiased m-0 p-0">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
